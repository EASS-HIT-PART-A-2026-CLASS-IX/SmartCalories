server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path serves index.html so client-side router takes over.
  location / {
    try_files $uri /index.html;
  }

  # Proxy backend API (only when running behind compose with `api` resolvable on the network)
  location /api/ {
    proxy_pass http://api:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # Cache static assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
