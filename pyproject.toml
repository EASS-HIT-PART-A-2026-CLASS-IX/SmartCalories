[project]
name = "calorie-tracker-ex1"
version = "0.1.0"
description = "EASS EX1 – FastAPI calorie tracker (in-memory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["calorie_tracker/tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]
filterwarnings = ["ignore::Warning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calorie_tracker"]
