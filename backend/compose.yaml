# Single self-contained dev stack — `docker compose up --build`
#   db     local Postgres (NOT Neon) — the compose stack owns its own database
#   api    builds the backend image (deps), runs uvicorn --reload over bind-mounted source
#   web    Vite dev server (HMR) on http://localhost:5173; reads frontend/.env live
#   redis  backs the rate-limit middleware only
# Everything runs locally — no external Neon/Redis Cloud needed. (Prod deploy uses render.yaml,
# where DATABASE_URL/REDIS_URL point at managed services instead.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartcalories
      POSTGRES_PASSWORD: smartcalories
      POSTGRES_DB: smartcalories
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcalories -d smartcalories"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - sc_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: smart-calories-api
    # Build the image for the Python deps, then bind-mount source (below) so --reload picks up
    # edits without an image rebuild. `alembic upgrade head` runs migrations on boot.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn calorie_tracker.main:app --host 0.0.0.0 --port 9000 --reload --reload-dir /app/calorie_tracker",
      ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # The compose stack owns its DB + Redis — point at the local containers, NOT the .env
      # values (those are for non-Docker / prod runs). Override here only if you really mean to.
      DATABASE_URL: postgresql+psycopg://smartcalories:smartcalories@db:5432/smartcalories
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      # LLM providers (all optional, read from backend/.env). Claude is tried first when set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "9000:9000"
    extra_hosts:
      # Lets the api container reach a Mac/Linux host's Ollama at host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./calorie_tracker:/app/calorie_tracker
      - ./alembic.ini:/app/alembic.ini
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import httpx,sys; sys.exit(0 if httpx.get("http://localhost:9000/health").status_code==200 else 1)''',
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports:
      - "6379:6379"

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173"]
    # Load every VITE_* from frontend/.env into the container (Firebase config, etc.).
    env_file:
      - path: ../frontend/.env
        required: false
    environment:
      # Force the backend URL — in compose we always know where the api is.
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:9000}
    volumes:
      - ../frontend:/app
      # Named volume so the host's node_modules (macOS) doesn't clobber the container's (Linux).
      - sc_web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sc_pgdata:
  sc_web_node_modules:
