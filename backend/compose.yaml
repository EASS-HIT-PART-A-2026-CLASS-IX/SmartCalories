# Single self-contained dev stack — `docker compose up --build`
#   db         local Postgres (NOT Neon) — the compose stack owns its own database
#   api        builds the backend image (deps), runs uvicorn --reload over bind-mounted source
#   web        Vite dev server (HMR) on http://localhost:5173; reads frontend/.env live
#   redis      backs the rate-limit middleware + the refresher's rollup cache
#   refresher  async worker: re-runs scripts/refresh.py on an interval (idempotent rollup cache)
# Everything runs locally — no external Neon/Redis Cloud needed. (Prod deploy uses render.yaml,
# where DATABASE_URL/REDIS_URL point at managed services instead.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartcalories
      POSTGRES_PASSWORD: smartcalories
      POSTGRES_DB: smartcalories
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcalories -d smartcalories"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - sc_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: smart-calories-api
    # Build the image for the Python deps, then bind-mount source (below) so --reload picks up
    # edits without an image rebuild. `alembic upgrade head` runs migrations on boot.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn calorie_tracker.main:app --host 0.0.0.0 --port 9000 --reload --reload-dir /app/calorie_tracker",
      ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # The compose stack owns its DB + Redis — point at the local containers, NOT the .env
      # values (those are for non-Docker / prod runs). Override here only if you really mean to.
      DATABASE_URL: postgresql+psycopg://smartcalories:smartcalories@db:5432/smartcalories
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      # LLM providers (all optional, read from backend/.env). Claude is tried first when set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Local open-source LLM via the `local-llm` profile (see the `ollama` service below). The
      # default points at the bundled Ollama. The agent puts Ollama FIRST when it's actually
      # reachable (local-first) and omits it otherwise — so plain `up` (no profile, nothing running
      # there) is unaffected and falls through to the cloud keys.
      # No `/v1` suffix: LiteLLM's `ollama_chat/` provider hits Ollama's native /api/chat.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "9000:9000"
    extra_hosts:
      # Lets the api container reach a Mac/Linux host's Ollama at host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # When the `local-llm` profile is active, wait for the model pull to finish before serving so
      # the first chat works. `required: false` drops this dependency when the profile is off.
      ollama-pull:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./calorie_tracker:/app/calorie_tracker
      - ./alembic.ini:/app/alembic.ini
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import httpx,sys; sys.exit(0 if httpx.get("http://localhost:9000/health").status_code==200 else 1)''',
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  refresher:
    # Async worker: periodically recomputes each user's daily rollups into the Redis cache.
    # Reuses the api image and the idempotent scripts/refresh.py — a rerun with unchanged data
    # writes nothing (digests match), so looping on a timer is safe. Interval is configurable;
    # the cache TTL (36h) outlives the default cadence so a missed tick leaves yesterday's snapshot.
    image: smart-calories-api
    command:
      [
        "sh",
        "-c",
        'while true; do python -m calorie_tracker.scripts.refresh || true; sleep "${REFRESH_INTERVAL_SECONDS:-3600}"; done',
      ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+psycopg://smartcalories:smartcalories@db:5432/smartcalories
      REDIS_URL: redis://redis:6379/0
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        # Wait for the api so migrations (alembic upgrade head) have run before we read tables.
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./calorie_tracker:/app/calorie_tracker

  # --- Local open-source LLM (opt-in) ----------------------------------------------------------
  # `docker compose --profile local-llm up` runs Ollama + pulls a small tool-capable model, so the
  # agent works with NO cloud API key — local llama3.2:1b becomes the default until a user adds
  # their own key (BYO keys always take priority). CPU-only inference is slow; the first pull
  # downloads ~2 GB into the sc_ollama volume (cached for next time). Gemma was considered but its
  # tool-calling on Ollama is unreliable; override with OLLAMA_MODEL if you want a different tag.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - sc_ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: pulls the model into the shared volume, then exits. The api waits for this to finish.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:1b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports:
      - "6379:6379"

  web:
    image: node:22-alpine
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    # Load every VITE_* from frontend/.env into the container (Firebase config, etc.).
    env_file:
      - path: ../frontend/.env
        required: false
    environment:
      # Force the backend URL — in compose we always know where the api is.
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:9000}
    volumes:
      - ../frontend:/app
      # Named volume so the host's node_modules (macOS) doesn't clobber the container's (Linux).
      - sc_web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sc_pgdata:
  sc_web_node_modules:
  sc_ollama:
