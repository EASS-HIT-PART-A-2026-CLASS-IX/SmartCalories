[project]
name = "smart-calories"
version = "0.2.0"
description = "AI-powered calorie tracking & dieting agent (EX3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "firebase-admin>=6.5",
    # Redis backs the rate-limit middleware + the refresher's rollup cache.
    "redis>=5.2",
    "smolagents[litellm,toolkit]>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # anyio ships the `pytest.mark.anyio` plugin used by the Session 09 refresh tests.
    "anyio>=4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["calorie_tracker/tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]
filterwarnings = ["ignore::Warning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calorie_tracker"]
