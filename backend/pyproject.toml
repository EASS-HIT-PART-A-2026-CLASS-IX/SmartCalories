[project]
name = "smart-calories"
version = "0.2.0"
description = "AI-powered calorie tracking & dieting agent (EX3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "firebase-admin>=6.5",
    "pydantic-ai-slim[google,groq,openai]>=0.0.20",
    "google-genai>=0.3",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "arq>=0.26",
    "anyio>=4.6",
    "tenacity>=9.0",
    "reportlab>=4.2",
    "pandas>=2.2",
    "logfire>=2.0",
    "fastmcp>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "fakeredis>=2.26",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["calorie_tracker/tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]
filterwarnings = ["ignore::Warning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calorie_tracker"]
